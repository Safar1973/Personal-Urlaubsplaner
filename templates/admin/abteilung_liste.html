{% extends "base.html" %}
{% block title %}Abteilungen{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold mb-0"><i class="bi bi-building me-2 text-primary"></i>Abteilungen</h2>
        <div class="d-flex gap-2">
            <a href="{{ url_for('admin.index') }}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>
            </a>
            <a href="{{ url_for('admin.abteilung_neu') }}" class="btn btn-success btn-glow">
                <i class="bi bi-plus me-1"></i>Neue Abteilung
            </a>
        </div>
    </div>
    <div class="card glass-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead><tr><th>Name</th><th>Beschreibung</th><th class="text-center">Mitarbeiter</th><th class="text-end">Aktionen</th></tr></thead>
                    <tbody>
                    {% for a in abteilungen %}
                    <tr>
                        <td class="fw-semibold">{{ a.name }}</td>
                        <td class="text-muted small">{{ a.beschreibung or '–' }}</td>
                        <td class="text-center">{{ a.mitarbeiter|length }}</td>
                        <td class="text-end">
                            <a href="{{ url_for('admin.abteilung_bearbeiten', abteilung_id=a.id) }}"
                               class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
