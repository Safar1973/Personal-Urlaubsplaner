{% extends "base.html" %}
{% block title %}Abwesenheitsarten{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold mb-0"><i class="bi bi-tags me-2 text-primary"></i>Abwesenheitsarten</h2>
        <div class="d-flex gap-2">
            <a href="{{ url_for('admin.index') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
            <a href="{{ url_for('admin.abwesenheitsart_neu') }}" class="btn btn-warning btn-glow text-dark">
                <i class="bi bi-plus me-1"></i>Neue Art
            </a>
        </div>
    </div>
    <div class="card glass-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0">
                    <thead><tr><th>Farbe</th><th>Name</th><th class="text-center">Bezahlt</th><th class="text-center">Als Urlaub</th><th class="text-end">Aktionen</th></tr></thead>
                    <tbody>
                    {% for art in arten %}
                    <tr>
                        <td><span class="color-dot" style="background:{{ art.farbe }}; width:24px; height:24px; border-radius:4px;"></span></td>
                        <td class="fw-semibold">{{ art.name }}</td>
                        <td class="text-center">
                            <i class="bi bi-{{ 'check-circle-fill text-success' if art.bezahlt else 'x-circle text-muted' }}"></i>
                        </td>
                        <td class="text-center">
                            <i class="bi bi-{{ 'check-circle-fill text-primary' if art.zaehlt_als_urlaub else 'x-circle text-muted' }}"></i>
                        </td>
                        <td class="text-end">
                            <a href="{{ url_for('admin.abwesenheitsart_bearbeiten', art_id=art.id) }}"
                               class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
